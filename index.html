<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AER+ Training | Simple Tools for Grassroots Clubs</title>
    <meta name="description" content="AER+ Training is developing Amble, a simple, low-cost product suite for grassroots sports clubs, starting with membership forms and renewals.">
    <style>
        :root {
            --primary: #B2DFB6;
            --primary-hover: #9ED3A3;
            --primary-dark: #1A3A24;
            --primary-light: #EBF6EC;
            --sage-dot: #A8DDA8;
            --text-main: #142419;
            --text-muted: #425447;
            --bg-canvas: #F9FAF9;
            --bg-card: #FFFFFF;
            --bg-subtle: #F1F5F2;
            --border-color: #DCE5DE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            color: var(--text-main);
            background-color: var(--bg-canvas);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(249, 250, 249, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            text-decoration: none;
        }

        .logo svg {
            height: 38px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .nav-phone {
            font-weight: 700 !important;
            color: var(--text-main) !important;
            background: var(--primary-light);
            padding: 0 14px !important;
            border-radius: 10px;
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 24px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--primary-dark);
            background: var(--primary-light);
            border: 1px solid #CBE7CE;
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 2.75rem;
            font-weight: 800;
            color: var(--text-main);
            max-width: 760px;
            margin: 0 auto 18px auto;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .hero p {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 32px auto;
            line-height: 1.65;
        }

        /* General Section Layout */
        section {
            padding: 80px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.015em;
        }

        /* Amble Suite Cards Grid */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            align-items: stretch;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 30px -10px rgba(20, 36, 25, 0.04);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -15px rgba(20, 36, 25, 0.09);
        }

        .card.featured {
            border: 2px solid var(--primary);
            box-shadow: 0 20px 40px -15px rgba(178, 223, 182, 0.35);
        }

        .card.placeholder {
            background: var(--bg-subtle);
            border: 1px dashed #B8C7BC;
        }

        .card-badge {
            position: absolute;
            top: 20px;
            right: 24px;
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: var(--bg-subtle);
            color: var(--text-muted);
        }

        .card.featured .card-badge {
            background: var(--primary);
            color: var(--primary-dark);
        }
